version: '3'

tasks:
  work:
    desc: Continue a project conversation here or in its Codespace
    interactive: true
    cmds:
      - bash scripts/project-sync.sh work {{.CLI_ARGS}}
  setup:
    desc: Configure a project with the interactive wizard (task setup -- --project PATH)
    interactive: true
    cmds:
      - bash scripts/setup.sh {{.CLI_ARGS}}
  up:
    desc: Start the development container
    cmds: [{task: 'devcontainer:up'}]
  down:
    desc: Stop the development container
    cmds: [{task: 'devcontainer:down'}]
  status:
    desc: Show the workspace container and published ports
    cmds: [{task: 'devcontainer:status'}]
  build:
    desc: Build the development container
    cmds:
      - devcontainer build --workspace-folder .
  test:
    desc: Run discovery, rendering, preferences, Git and launch tests
    cmds:
      - python3 -m unittest discover -s tests -v
  scratch:configure:
    desc: Project continuity scratch configure
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch configure {{.CLI_ARGS}}

  scratch:start:
    desc: Project continuity scratch start
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch start {{.CLI_ARGS}}

  scratch:stop:
    desc: Project continuity scratch stop
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch stop {{.CLI_ARGS}}

  scratch:status:
    desc: Project continuity scratch status
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch status {{.CLI_ARGS}}

  scratch:logs:
    desc: Project continuity scratch logs
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch logs {{.CLI_ARGS}}

  scratch:backup:
    desc: Project continuity scratch backup
    interactive: true
    cmds:
      - bash scripts/project-sync.sh scratch backup {{.CLI_ARGS}}

  agent:codex:
    desc: Project continuity agent codex
    interactive: true
    cmds:
      - bash scripts/project-sync.sh agent codex {{.CLI_ARGS}}

  agent:claude:
    desc: Project continuity agent claude
    interactive: true
    cmds:
      - bash scripts/project-sync.sh agent claude {{.CLI_ARGS}}

  agent:sessions:
    desc: Project continuity agent sessions
    interactive: true
    cmds:
      - bash scripts/project-sync.sh agent sessions {{.CLI_ARGS}}

  agent:handoff:
    desc: Project continuity agent handoff
    interactive: true
    cmds:
      - bash scripts/project-sync.sh agent handoff {{.CLI_ARGS}}

  agent:recover:
    desc: Project continuity agent recover
    interactive: true
    cmds:
      - bash scripts/project-sync.sh agent recover {{.CLI_ARGS}}

  check:
    desc: Validate Python syntax, shell scripts and whitespace
    cmds:
      - python3 -m compileall -q devcontainer_setup
      - shellcheck install.sh scripts/*.sh .devcontainer/scripts/*.sh templates/scripts/*.sh
      - git diff --check
  rebuild:
    desc: Rebuild the dev container with the Dev Containers CLI
    preconditions:
      - sh: command -v devcontainer >/dev/null 2>&1
        msg: "Dev Containers CLI is not installed. Install with: npm i -g @devcontainers/cli"
    cmds:
      - devcontainer up --workspace-folder . --remove-existing-container --log-level trace
    silent: false

includes:
  devcontainer:
    taskfile: .devcontainer/Taskfile.yml
    optional: true
