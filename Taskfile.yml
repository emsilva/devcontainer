version: '3'

tasks:
  work:
    desc: Open local project work in Herdr
    interactive: true
    cmds:
      - bash scripts/project-sync.sh work {{.CLI_ARGS}}
  work:cs:
    desc: Open Codespace Herdr with continuous recovery on this Mac
    interactive: true
    cmds:
      - bash scripts/project-sync.sh work --codespace {{.CLI_ARGS}}
  work:status:
    desc: Show the last checkpoint received on this Mac
    cmds:
      - bash scripts/project-sync.sh work --status {{.CLI_ARGS}}
  work:stop:
    desc: Stop this project backup and scratch worker
    cmds:
      - bash scripts/project-sync.sh work --stop {{.CLI_ARGS}}
  work:codex:
    desc: Start Codex here; add -- --resume to choose a conversation
    interactive: true
    cmds:
      - bash scripts/project-sync.sh work --agent codex {{.CLI_ARGS}}
  work:claude:
    desc: Start Claude here; add -- --resume to choose a conversation
    interactive: true
    cmds:
      - bash scripts/project-sync.sh work --agent claude {{.CLI_ARGS}}
  setup:
    desc: Configure a project with the interactive wizard (task setup -- --project PATH)
    interactive: true
    cmds:
      - bash scripts/setup.sh {{.CLI_ARGS}}
  up:
    desc: Start the development container
    cmds: [{task: 'devcontainer:up'}]
  down:
    desc: Stop the development container
    cmds: [{task: 'devcontainer:down'}]
  status:
    desc: Show the workspace container and published ports
    cmds: [{task: 'devcontainer:status'}]
  build:
    desc: Build the development container
    cmds:
      - devcontainer build --workspace-folder .
  test:
    desc: Run discovery, rendering, preferences, Git and launch tests
    cmds:
      - python3 -m unittest discover -s tests -v
  scratch:configure:
    desc: Advanced scratch configure
    cmds:
      - bash scripts/project-sync.sh scratch configure {{.CLI_ARGS}}
  scratch:start:
    desc: Advanced scratch start
    cmds:
      - bash scripts/project-sync.sh scratch start {{.CLI_ARGS}}
  scratch:stop:
    desc: Advanced scratch stop
    cmds:
      - bash scripts/project-sync.sh scratch stop {{.CLI_ARGS}}
  scratch:status:
    desc: Advanced scratch status
    cmds:
      - bash scripts/project-sync.sh scratch status {{.CLI_ARGS}}
  scratch:logs:
    desc: Advanced scratch logs
    cmds:
      - bash scripts/project-sync.sh scratch logs {{.CLI_ARGS}}
  scratch:backup:
    desc: Advanced scratch backup
    cmds:
      - bash scripts/project-sync.sh scratch backup {{.CLI_ARGS}}
  check:
    desc: Validate Python syntax, shell scripts and whitespace
    cmds:
      - python3 -m compileall -q devcontainer_setup
      - shellcheck install.sh scripts/*.sh .devcontainer/scripts/*.sh templates/scripts/*.sh
      - git diff --check
  rebuild:
    desc: Rebuild the dev container with the Dev Containers CLI
    preconditions:
      - sh: command -v devcontainer >/dev/null 2>&1
        msg: "Dev Containers CLI is not installed. Install with: npm i -g @devcontainers/cli"
    cmds:
      - devcontainer up --workspace-folder . --remove-existing-container --log-level trace
    silent: false

includes:
  devcontainer:
    taskfile: .devcontainer/Taskfile.yml
    optional: true
