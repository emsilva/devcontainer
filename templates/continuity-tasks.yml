  work:cs:
    desc: Connect Codespace Herdr and sync scratch and project conversations
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --codespace {{.CLI_ARGS}}
  work:status:
    desc: Show scratch and project conversation synchronization status
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --status {{.CLI_ARGS}}
  work:disconnect:
    desc: Disconnect this project's saved Codespace machine from Herdr
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --disconnect {{.CLI_ARGS}}
  work:stop:
    desc: Stop this project scratch and conversation sync worker
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --stop {{.CLI_ARGS}}
  work:cs:armed:
    desc: Connect the Codespace and arm automatic restart after the 12-hour stop
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --armed {{.CLI_ARGS}}
  work:disarm:
    desc: Disarm automatic Codespace restart for this project
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --disarm {{.CLI_ARGS}}
  work:hold:
    desc: Hold restarts until a local time, or off (task work:hold -- 09:30)
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --hold {{.CLI_ARGS}}
  work:cs:stop:
    desc: Stop this project Codespace and keep it stopped
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --codespace-stop {{.CLI_ARGS}}
  work:cs:restart:
    desc: Restart this project Codespace now and bring Herdr back
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --codespace-restart {{.CLI_ARGS}}
  work:logs:
    desc: Show recent keeper and sync worker logs (task work:logs -- --follow)
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --logs {{.CLI_ARGS}}
  scratch:configure:
    desc: Advanced scratch configure
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch configure {{.CLI_ARGS}}
  scratch:start:
    desc: Advanced scratch start
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch start {{.CLI_ARGS}}
  scratch:stop:
    desc: Advanced scratch stop
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch stop {{.CLI_ARGS}}
  scratch:status:
    desc: Advanced scratch status
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch status {{.CLI_ARGS}}
  scratch:logs:
    desc: Advanced scratch logs
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch logs {{.CLI_ARGS}}
  scratch:backup:
    desc: Advanced scratch backup
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch backup {{.CLI_ARGS}}
