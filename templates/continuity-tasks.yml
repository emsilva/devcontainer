  work:
    desc: Open local project work in Herdr
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work {{.CLI_ARGS}}
  work:cs:
    desc: Connect Codespace to local Herdr with continuous recovery on this Mac
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --codespace {{.CLI_ARGS}}
  work:status:
    desc: Show the last checkpoint received on this Mac
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --status {{.CLI_ARGS}}
  work:disconnect:
    desc: Disconnect this project's saved Codespace machine from Herdr
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --disconnect {{.CLI_ARGS}}
  work:stop:
    desc: Stop this project backup and scratch worker
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --stop {{.CLI_ARGS}}
  work:codex:
    desc: Start Codex here; add -- --resume to choose a conversation
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --agent codex {{.CLI_ARGS}}
  work:claude:
    desc: Start Claude here; add -- --resume to choose a conversation
    interactive: true
    cmds:
      - bash .devcontainer/scripts/project-sync.sh work --agent claude {{.CLI_ARGS}}
  scratch:configure:
    desc: Advanced scratch configure
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch configure {{.CLI_ARGS}}
  scratch:start:
    desc: Advanced scratch start
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch start {{.CLI_ARGS}}
  scratch:stop:
    desc: Advanced scratch stop
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch stop {{.CLI_ARGS}}
  scratch:status:
    desc: Advanced scratch status
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch status {{.CLI_ARGS}}
  scratch:logs:
    desc: Advanced scratch logs
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch logs {{.CLI_ARGS}}
  scratch:backup:
    desc: Advanced scratch backup
    cmds:
      - bash .devcontainer/scripts/project-sync.sh scratch backup {{.CLI_ARGS}}
