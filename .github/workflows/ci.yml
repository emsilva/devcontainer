name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck scripts
        run: shellcheck .devcontainer/scripts/*.sh scripts/*.sh templates/scripts/*.sh install.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the GitHub CLI tested by the no-start transport gate
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          printf 'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  %s\n' "$RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.102.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Install Task for Taskfile integration tests
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          GOBIN="$RUNNER_TEMP/task-bin" go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
      - name: Install checksum-pinned Mutagen for mandatory boundary tests
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          from devcontainer_setup.project_sync.tools import install_mutagen

          binary = install_mutagen(Path(os.environ['RUNNER_TEMP']) / 'mutagen-boundary-tools')
          subprocess.run([str(binary), 'version'], check=True, timeout=10)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('MUTAGEN_TEST_BINARY=' + str(binary) + '\n')
          PYTHON
      - name: Wizard tests
        run: python3 -m unittest discover -s tests -v
