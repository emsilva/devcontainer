name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck scripts
        run: shellcheck .devcontainer/scripts/*.sh scripts/*.sh templates/scripts/*.sh install.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Install Task for Taskfile integration tests
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          GOBIN="$RUNNER_TEMP/task-bin" go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
      - name: Wizard tests
        run: python3 -m unittest discover -s tests -v
