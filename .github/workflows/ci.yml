name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.sh', '**.py', 'templates/**', 'Taskfile.yml', '.github/workflows/ci.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck scripts
        run: shellcheck .devcontainer/scripts/*.sh scripts/*.sh templates/scripts/*.sh install.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Wizard tests
        run: python3 -m unittest discover -s tests -v
