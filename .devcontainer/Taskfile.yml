version: '3'

tasks:
  setup:
    desc: Run the project-aware setup wizard
    interactive: true
    cmds:
      - bash scripts/setup.sh {{.CLI_ARGS}}
  check:
    desc: Validate the installed selected configuration
    cmds:
      - bash scripts/setup.sh --check
  up:
    desc: Start this workspace's development container
    cmds:
      - devcontainer up --workspace-folder .
  down:
    desc: Stop this workspace's running development container
    cmds:
      - |
        containers=$(docker ps -q --filter "label=devcontainer.local_folder=$PWD")
        if [ -n "$containers" ]; then docker stop $containers; fi
  status:
    desc: Show this workspace's running container and published ports
    cmds:
      - docker ps --filter "label=devcontainer.local_folder=$PWD" --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}'
  rebuild:
    desc: Rebuild the dev container with the Dev Containers CLI
    preconditions:
      - sh: command -v devcontainer >/dev/null 2>&1
        msg: "Dev Containers CLI is not installed. Install with: npm i -g @devcontainers/cli"
    cmds:
      - devcontainer up --workspace-folder . --remove-existing-container --log-level trace
    silent: false
  upgrade:self:
    desc: Review a deliberate generator upgrade
    interactive: true
    cmds:
      - bash scripts/setup.sh --upgrade {{.CLI_ARGS}}
    silent: false

  upgrade:codex:
    desc: Download and install the latest Codex CLI without rebuilding the container
    dir: .devcontainer
    cmds:
      - ./scripts/upgrade-codex.sh
    silent: false

  upgrade:lock:
    desc: Refresh devcontainer-lock.json to the newest feature versions allowed by devcontainer.json (deliberate dependency bump — review the diff before committing/rebuilding)
    dir: .devcontainer
    cmds:
      - bash -lc 'cd .. && npx -y @devcontainers/cli@latest upgrade --workspace-folder .'
    silent: false

  setup:dotfiles:
    desc: "Apply a chezmoi dotfiles repo into $HOME (usage: task setup:dotfiles -- <repo>; omit to use $DOTFILES_REPO or be prompted)"
    dir: .devcontainer
    interactive: true
    cmds:
      - ./scripts/setup-dotfiles.sh {{.CLI_ARGS}}
    silent: false
